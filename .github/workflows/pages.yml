name: Refresh data and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Opt-in only: the job is skipped until ENABLE_PAGES is set to "true".
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: eigenpolitics-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Scheduled refreshes preserve successful snapshots in Git, so Congress
      # rollovers do not depend on an evictable Actions cache.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # A queued run uses the latest main, never an older push snapshot.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate the checked-in snapshot
        run: python scripts/refresh_pages.py --check
      - name: Refresh the current and previous Senate
        if: ${{ github.event_name != 'push' }}
        id: refresh
        # A push can publish the reviewed snapshot even during a Voteview outage.
        # Scheduled/manual runs fetch only six CSVs, then realign all history.
        # Any failed refresh stops this job and leaves the previous site live.
        run: python scripts/refresh_pages.py
      - name: Check for concurrent source changes
        # Never overwrite another push or publish a known superseded snapshot.
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during this run. Retry from the latest source; no snapshot was overwritten or deployed."
            exit 1
          fi
      - name: Preserve a changed data snapshot
        if: ${{ steps.refresh.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data
          git commit -m "Refresh Senate voting data"
          # A normal push fails safely if main changed; never force-push.
          # GITHUB_TOKEN pushes do not trigger a recursive workflow run.
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
