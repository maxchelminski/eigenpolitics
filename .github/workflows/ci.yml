name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q scripts eigenpolitics
      - name: Validate the published data snapshot
        run: python scripts/refresh_pages.py --check
      - name: Set up Node for JavaScript validation
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check site/app.js
      - name: Install browser verification dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify explorer interactions and mobile layout
        run: |
          python scripts/serve.py > /tmp/eigenpolitics-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
