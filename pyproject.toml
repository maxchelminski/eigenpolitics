[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenpolitics"
version = "1.0.0"
description = "Interactive spectral analysis of U.S. Senate voting networks with shared-senator alignment and reproducible data refreshes"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
eigenpolitics-refresh = "eigenpolitics.cli:main"

[tool.setuptools.packages.find]
include = ["eigenpolitics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
